---
- name: Terminate EC2 instance and clean AWS resources
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: eu-central-1
    instance_name: wordpress-instance
    key_name: my_aws
    sec_group: wp-security-group

  tasks:
    - name: Get instance ID by name
      amazon.aws.ec2_instance_info:
        filters:
          "tag:Name": "{{ instance_name }}"
        region: "{{ region }}"
        aws_access_key: "{{ ec2_access_key }}"
        aws_secret_key: "{{ ec2_secret_key }}"
      register: instance_info

    - name: Terminate EC2 instance
      amazon.aws.ec2_instance:
        instance_ids: "{{ instance_info.instances | map(attribute='instance_id') | list }}"
        region: "{{ region }}"
        state: absent
        wait: true
        aws_access_key: "{{ ec2_access_key }}"
        aws_secret_key: "{{ ec2_secret_key }}"
      when: instance_info.instances | length > 0

    - name: Delete security group
      amazon.aws.ec2_security_group:
        name: "{{ sec_group }}"
        region: "{{ region }}"
        state: absent
        aws_access_key: "{{ ec2_access_key }}"
        aws_secret_key: "{{ ec2_secret_key }}"

    - name: Delete key pair
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ region }}"
        state: absent
        aws_access_key: "{{ ec2_access_key }}"
        aws_secret_key: "{{ ec2_secret_key }}"

